---
# https://metallb.org/usage/
#apiVersion: metallb.io/v1beta1
apiVersion: v1
kind: Service
metadata:
  name: gitea-ssh
spec:
  type: LoadBalancer
  loadBalancerIP: "${ip_address}"
  ports:
    - name: ssh
      protocol: TCP
      port: 22
      targetPort: 22
  selector:
    app: gitea
status:
  loadBalancer:
    ingress:
    - ip: "${ip_address}"
