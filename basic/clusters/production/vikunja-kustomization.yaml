---
apiVersion: kustomize.toolkit.fluxcd.io/v1beta2
kind: Kustomization
metadata:
  name: vikunja
  namespace: flux-system
spec:
  interval: 5m
  timeout: 30m
  dependsOn:
    - name: single-sign-on
  sourceRef:
    kind: GitRepository
    name: stackspout
  path: ./basic/apps/do
  prune: true
  # TODO what does this mean?
  #validation: client
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2beta1
      kind: HelmRelease
      name: vikunja
      namespace: stackspout
    - apiVersion: apps/v1
      kind: Deployment
      name: vikunja
      namespace: stackspout
  postBuild:
    substituteFrom:
      #- kind: Secret
      #  name: stackspin-vikunja-variables
      - kind: Secret
        name: stackspin-vikunja-oauth-variables
      - kind: Secret
        name: stackspin-cluster-variables
