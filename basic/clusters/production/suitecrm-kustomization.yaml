---
apiVersion: kustomize.toolkit.fluxcd.io/v1beta2
kind: Kustomization
metadata:
  name: suitecrm
  namespace: flux-system
spec:
  interval: 5m
  timeout: 12h
  dependsOn:
    - name: single-sign-on
  sourceRef:
    kind: GitRepository
    name: stackspout
  path: ./basic/apps/people
  prune: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2beta1
      kind: HelmRelease
      name: suitecrm
      namespace: stackspout
    - apiVersion: apps/v1
      kind: Deployment
      name: suitecrm
      namespace: stackspout
    - apiVersion: apps/v1
      kind: StatefulSet
      name: suitecrm-mariadb
      namespace: stackspout
  postBuild:
    substituteFrom:
      #- kind: Secret
      #  name: stackspin-suitecrm-variables
      #- kind: Secret
      #  name: stackspin-suitecrm-oauth-variables
      - kind: Secret
        name: stackspin-cluster-variables
