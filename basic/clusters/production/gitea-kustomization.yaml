---
apiVersion: kustomize.toolkit.fluxcd.io/v1beta2
kind: Kustomization
metadata:
  name: gitea
  namespace: flux-system
spec:
  interval: 30m
  wait: true
  timeout: 1h
  dependsOn:
    - name: single-sign-on
  sourceRef:
    kind: GitRepository
    name: stackspout
  path: ./basic/apps/dev
  prune: true
  postBuild:
    substituteFrom:
      #- kind: Secret
      #  name: stackspin-gitea-variables
      - kind: Secret
        name: stackspin-gitea-oauth-variables
      - kind: Secret
        name: stackspin-cluster-variables
