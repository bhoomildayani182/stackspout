apiVersion: kustomize.toolkit.fluxcd.io/v1beta2
kind: Kustomization
metadata:
  name: kube-system-config
  namespace: flux-system
spec:
  interval: 1h
  timeout: 20m
  dependsOn:
    - name: metallb
  sourceRef:
    kind: GitRepository
    name: stackspout
  path: ./basic/config/kube-system
  prune: true
  postBuild:
    substituteFrom:
      - kind: Secret
        name: stackspin-cluster-variables
