apiVersion: v1
kind: Service
metadata:
  name: gitea-ssh
  namespace: stackspout
spec:
  type: LoadBalancer
  loadBalancerIP: 212.224.115.169 #"${ip_address}"
  ports:
    - name: ssh
      protocol: TCP
      port: 22
      targetPort: 22
  selector:
    app: gitea
