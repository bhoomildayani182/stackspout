---
apiVersion: v1
kind: ConfigMap
metadata:
  name: stackspin-suitecrm-values
  namespace: stackspout
data:
  values.yaml: |
    ingress:
      enabled: true
      annotations:
        kubernetes.io/tls-acme: "true"
        cert-manager.io/cluster-issuer: letsencrypt-issuer-staging
      hostname: "people.${domain}"
      tls: true
      certManager: true
