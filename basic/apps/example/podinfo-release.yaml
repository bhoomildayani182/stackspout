apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: podinfo
  namespace: stackspout
spec:
  releaseName: podinfo
  chart:
    spec:
      # https://artifacthub.io/packages/helm/podinfo/podinfo
      chart: podinfo
      version: 6.1.1
      sourceRef:
        kind: HelmRepository
        name: podinfo
        namespace: stackspout
  interval: 60m
  # Default values
  # https://github.com/stefanprodan/podinfo/blob/master/charts/podinfo/values.yaml
  values:
    ingress:
      enabled: true
