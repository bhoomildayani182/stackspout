apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: gitea
  namespace: stackspout
spec:
  releaseName: gitea
  chart:
    spec:
      chart: gitea
      version: 5.0.4
      sourceRef:
        kind: HelmRepository
        name: gitea
        namespace: stackspout
  interval: 10m
  values:
    ingress:
      enabled: true
    hosts:
      - host: git.ftt.gmbh
        paths:
           - path: /
             pathType: Prefix
