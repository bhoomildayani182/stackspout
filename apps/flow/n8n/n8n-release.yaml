apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: n8n
  namespace: stackspout
spec:
  releaseName: n8n
  chart:
    spec:
      chart: n8n
      version: 0.20.1
      sourceRef:
        kind: HelmRepository
        name: 8gears
        namespace: flux-system
  interval: 5m
  valuesFrom:
    - kind: ConfigMap
      name: stackspin-n8n-values
      optional: false
    # Allow overriding values by ConfigMap or Secret
    - kind: ConfigMap
      name: stackspin-n8n-override
      optional: true
    - kind: Secret
      name: stackspin-n8n-override
      optional: true
