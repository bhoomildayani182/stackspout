apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: zammad
  namespace: stackspout
spec:
  releaseName: zammad
  chart:
    spec:
      chart: zammad
      version: 10.3.4
      sourceRef:
        kind: HelmRepository
        name: zammad
        namespace: flux-system
  interval: 5m
  valuesFrom:
    - kind: ConfigMap
      name: stackspin-zammad-values
      optional: false
    # Allow overriding values by ConfigMap or Secret
    - kind: ConfigMap
      name: stackspin-zammad-override
      optional: true
    - kind: Secret
      name: stackspin-zammad-override
      optional: true
