apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: calcom
  namespace: stackspout
spec:
  releaseName: calcom
  chart:
    spec:
      chart: calcom-stack
      version: 0.1.6
      sourceRef:
        kind: HelmRepository
        name: calcom
        namespace: flux-system
  interval: 5m
  valuesFrom:
    - kind: ConfigMap
      name: stackspout-calcom-values
      optional: false
    # Allow overriding values by ConfigMap or Secret
    - kind: ConfigMap
      name: stackspout-calcom-override
      optional: true
    - kind: Secret
      name: stackspout-calcom-override
      optional: true
